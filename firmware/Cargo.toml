[package]
name = "esp32c3-airmouse"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[[bin]]
name = "esp32c3-airmouse"
harness = false # rust-analyzer가 테스트 하네스와 충돌하는 문제 방지

[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "z"

[dependencies]
anyhow = "1"
log = "0.4"
esp-idf-svc = { version = "0.52", features = ["critical-section", "embassy-time-driver", "embassy-sync"] }
embassy-time = { version = "0.5", features = ["generic-queue-8"] }
esp32-nimble = "0.12"
icm42670 = "0.2"
zerocopy = "0.8"
zerocopy-derive = "0.8"
ws2812-esp32-rmt-driver = { version = "0.14", features = ["smart-leds-trait"] }

[build-dependencies]
embuild = "0.33"
